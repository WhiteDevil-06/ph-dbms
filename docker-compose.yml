# ==============================================================================
# Docker Compose for Local Development Databases
# Project: Intelligent Data Management and Operational Analytics for
#          Autonomous Post-Harvest Material Handling Systems
# Maintainer: Rakshith Raghavendra (Project Lead & Database Architect)
# ==============================================================================

services:
  mysql:
    image: mysql:8.4
    container_name: post_harvest_mysql
    restart: "no"
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword_local}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-post_harvest_db}
      MYSQL_USER: ${MYSQL_USER:-post_harvest_app}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-apppassword_local}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Auto-executed in alphabetical order on first initialization
      - ./database/mysql/schema/01_baseline_schema.sql:/docker-entrypoint-initdb.d/01_baseline_schema.sql:ro
      - ./database/mysql/seed/01_devices_and_models_seed.sql:/docker-entrypoint-initdb.d/02_devices_and_models_seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:8.0
    container_name: post_harvest_mongodb
    restart: "no"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:-adminpassword_local}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-post_harvest_telemetry}
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
      # Auto-executed in alphabetical order on first initialization
      - ./database/mongodb/collections/01_create_collections.js:/docker-entrypoint-initdb.d/01_create_collections.js:ro
      - ./database/mongodb/indexes/01_create_indexes.js:/docker-entrypoint-initdb.d/02_create_indexes.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  mongo_data:
